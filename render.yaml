services:
  - type: web
    name: alhawy-exams
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIYAAR_DATA_DIR
        value: /var/data
      - key: MIYAAR_SETUP_KEY
        generateValue: true
    disk:
      name: alhawy-data
      mountPath: /var/data
      sizeGB: 5
